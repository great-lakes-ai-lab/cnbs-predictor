# Name of the workflow as it appears in the GitHub Actions tab
name: Environment Validation

# Triggers for the workflow
on:
  # Run on pushes to the main branch
  push:
    branches:
      - main
  # Run on pull requests targeting the main branch
  pull_request:
    branches:
      - main
  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:

# Define a single job that runs on multiple operating systems
jobs:
  build-environment:
    # Use a matrix strategy to run this job on different OS
    strategy:
      matrix:
        # --- CHANGE 1: Use a current Windows runner ---
        os: [ubuntu-latest, macos-latest, windows-latest]
        
    # Specify the operating system for the runner
    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4 # Use the latest stable version

      # Step 2: Set up Miniconda (recommended for Conda environments)
      # This action handles Python and Conda installation
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3 # Use the latest stable version
        with:
          # Python version from your environment.yaml, or a compatible one
          python-version: 3.12 
          # Environment file to create the environment from
          environment-file: requirements/cnbs_env.yaml
          # Conda channels to use during setup (must match your yaml)
          channels: conda-forge,defaults
          # Whether to use mamba for faster solving (optional, but good)
          use-mamba: true 
          # Whether to activate the environment after creation
          auto-activate-base: false # Important: Don't auto-activate base, we'll activate our custom env
          # Automatically activate the specified environment
          activate-environment: cnbs_env

      # Step 3: Verify the environment activation and a key package
      - name: Verify Environment and JupyterLab
        # The shell depends on the runner OS
        shell: bash -l {0} # Use bash -l for Linux/macOS, cmd or powershell for Windows if needed
        run: |
          echo "Verifying Conda environment: cnbs_env"
          conda info --envs # Show active environments
          conda list -n cnbs_env jupyterlab # Check if jupyterlab is in the env
          python -c "import jupyterlab; print('jupyterlab imported successfully from cnbs_env!')"